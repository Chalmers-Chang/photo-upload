<style>
  .chrome-end {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .chrome-menu { position: relative; flex-shrink: 0; }
  .chrome-menu > summary {
    list-style: none;
    box-sizing: border-box;
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line, #ddd4c6);
    background: var(--card, #fffcf7);
    color: var(--ink, #1c1915);
    border-radius: 50%;
    cursor: pointer;
  }
  .chrome-menu > summary::-webkit-details-marker,
  .chrome-menu > summary::marker { display: none; content: none; }
  .chrome-menu .logout-form {
    position: absolute;
    top: calc(100% + 0.1cm);
    left: 0;
    margin: 0;
    z-index: 31;
  }
  .chrome-menu .logout-form .admin-btn { white-space: nowrap; }
</style>
<div class="chrome-end">
  <a class="admin-btn" href="{{ url_for('admin_home') }}">{{ msg.admin }}</a>
  {% if is_admin %}
  <details class="chrome-menu">
    <summary title="{{ msg.chrome_menu }}" aria-label="{{ msg.chrome_menu }}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </summary>
    <form class="logout-form" method="post" action="{{ url_for('admin_logout') }}">
      <button class="admin-btn" type="submit">{{ msg.logout }}</button>
    </form>
  </details>
  {% endif %}
</div>
