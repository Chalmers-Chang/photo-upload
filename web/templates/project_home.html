{% extends "base.html" %}
{% block title %}{{ project.name }}{% endblock %}
{% block body %}
{% if project.pjt_url %}
<img class="page-bg" src="{{ project.pjt_url }}" alt="">
<div class="page-fade" style="opacity: {{ pjt_fade }}"></div>
{% endif %}
<div class="home">
  <div class="glass">
    <h1>{{ project.name }}</h1>
    <p class="lead">{{ msg.project_home_lead }}</p>
    <div class="actions">
      <a class="btn" href="{{ url_for('upload', slug=project.slug) }}">{{ msg.upload_photos }}</a>
      <a class="btn secondary" href="{{ url_for('slideshow', slug=project.slug) }}">{{ msg.play_slideshow }}</a>
      {% if is_admin %}
        <a class="btn lottery" href="{{ url_for('lottery', slug=project.slug) }}">{{ msg.lottery }}</a>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
