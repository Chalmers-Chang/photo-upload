<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ msg.slideshow_title.format(name=project.name) }}</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a09; color: #f4efe6; font-family: "PingFang TC", "Noto Sans TC", sans-serif; }
    {% if project.bkg_desktop_show or project.bkg_mobile_show %}
    html, body { background: #fff; }
    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    body::before {
      z-index: 0;
      background: url("{{ project.bkg_desktop_show or project.bkg_mobile_show }}") center / cover no-repeat;
    }
    @media (max-width: 640px) {
      body::before {
        background-image: url("{{ project.bkg_mobile_show or project.bkg_desktop_show }}");
      }
    }
    body::after {
      z-index: 0;
      background: #fff;
      opacity: {{ cfg.bkg_fade }};
    }
    {% endif %}
    .stage {
      position: relative;
      z-index: 1;
      height: 100%;
      height: 100dvh;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      overflow: hidden;
      padding: 2cm;
      box-sizing: border-box;
    }
    .frame { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
    img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      object-position: center;
      border-radius: 22px;
      opacity: 0;
      z-index: 1;
      transition: opacity {{ project.slideshow_fade }}s ease;
    }
    img.on { opacity: 1; z-index: 2; }
    .empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      margin: 0;
      opacity: 0.6;
    }
    img[hidden],
    .empty[hidden] {
      display: none !important;
    }
    .caption {
      justify-self: center;
      display: grid;
      max-width: 100%;
      margin-top: 16px;
      padding: 10px 22px;
      text-align: center;
      font-size: clamp(18px, 3vw, 28px);
      color: #1c1915;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow: 0 8px 32px rgba(28, 25, 21, 0.08);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
    }
    .caption:not(:has(.on)) {
      visibility: hidden;
      padding: 0;
      border: 0;
      background: none;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .caption span {
      grid-area: 1 / 1;
      opacity: 0;
      transition: opacity {{ project.slideshow_fade }}s ease;
    }
    .caption span.on { opacity: 1; }
    .admin-btn {
      position: fixed;
      top: 16px;
      right: 20px;
      z-index: 20;
      text-decoration: none;
      border: 1px solid #ddd4c6;
      background: #fffcf7;
      color: #1c1915;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='profile.css') }}">
</head>
<body>
  <a class="admin-btn" href="{{ url_for('admin_home') }}">{{ msg.admin }}</a>
  {% include "_name_modal.html" %}
  <div class="stage">
    <div class="frame">
      <img class="slide" alt="">
      <img class="slide" alt="">
      <p class="empty" id="empty">{{ msg.no_photos }}</p>
    </div>
    <div class="caption" id="caption" data-tpl="{{ msg.slideshow_credit }}" data-guest="{{ msg.guest_name }}">
      <span></span><span></span>
    </div>
  </div>
  <script>
    const api = {{ url_for('slideshow_api', slug=project.slug) | tojson }};
    const home = {{ url_for('project_home', slug=project.slug) | tojson }};
    const slides = [...document.querySelectorAll(".slide")];
    const caps = [...document.querySelectorAll("#caption span")];
    const empty = document.getElementById("empty");
    const caption = document.getElementById("caption");
    let timer = null;
    let shownId = null;
    let front = 0;
    let gen = 0;

    function goHome() {
      try { document.exitFullscreen(); } catch (e) {}
      location.href = home;
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        e.preventDefault();
        goHome();
      }
    });

    document.addEventListener("click", (e) => {
      if (e.target.closest(".admin-btn")) return;
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    }, { once: true });

    function credit(data) {
      return photoCredit(
        data.nickname || caption.dataset.guest,
        data.caption,
        caption.dataset.tpl
      );
    }

    function waitLoad(img) {
      return new Promise((resolve) => {
        if (img.src && img.complete && img.naturalWidth) {
          resolve();
          return;
        }
        const done = () => {
          img.removeEventListener("load", done);
          img.removeEventListener("error", done);
          resolve();
        };
        img.addEventListener("load", done);
        img.addEventListener("error", done);
      });
    }

    async function present(data) {
      const my = ++gen;
      const next = shownId == null ? 0 : 1 - front;
      const img = slides[next];
      const cap = caps[next];
      img.src = data.url;
      await waitLoad(img);
      if (my !== gen) return;
      cap.textContent = credit(data);
      img.classList.add("on");
      cap.classList.add("on");
      if (next !== front) {
        slides[front].classList.remove("on");
        caps[front].classList.remove("on");
      }
      empty.hidden = true;
      front = next;
      shownId = data.photo_id;
    }

    async function tick() {
      const res = await fetch(api, { cache: "no-store" });
      const data = await res.json();
      if (!data.photo_id) {
        gen += 1;
        empty.hidden = false;
        slides.forEach((el) => el.classList.remove("on"));
        caps.forEach((el) => {
          el.classList.remove("on");
          el.textContent = "";
        });
        shownId = null;
        timer = setTimeout(tick, 3000);
        return;
      }
      if (shownId !== data.photo_id) {
        present(data);
      } else {
        empty.hidden = true;
        caps[front].textContent = credit(data);
      }
      const waitMs = Math.max(250, (data.show_until - data.server_now) * 1000);
      timer = setTimeout(tick, waitMs);
    }

    tick();
  </script>
</body>
</html>
