<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>輪播 · {{ project.name }}</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a09; color: #f4efe6; font-family: "PingFang TC", "Noto Sans TC", sans-serif; }
    .stage {
      height: 100%;
      height: 100dvh;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      overflow: hidden;
    }
    .frame { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
    img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      object-position: center;
    }
    .empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      margin: 0;
      opacity: 0.6;
    }
    img[hidden],
    .empty[hidden] {
      display: none !important;
    }
    .caption {
      padding: 16px 24px 28px;
      text-align: center;
      font-size: clamp(18px, 3vw, 28px);
      min-height: 1.4em;
    }
    .admin-btn {
      position: fixed;
      top: 16px;
      right: 20px;
      z-index: 20;
      text-decoration: none;
      border: 1px solid #ddd4c6;
      background: #fffcf7;
      color: #1c1915;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='profile.css') }}">
</head>
<body>
  <a class="admin-btn" href="{{ url_for('admin_home') }}">Admin</a>
  {% include "_name_modal.html" %}
  <div class="stage">
    <div class="frame">
      <img id="photo" alt="" hidden>
      <p class="empty" id="empty">尚無照片</p>
    </div>
    <div class="caption" id="caption"></div>
  </div>
  <script>
    const api = {{ url_for('slideshow_api', slug=project.slug) | tojson }};
    const home = {{ url_for('project_home', slug=project.slug) | tojson }};
    const img = document.getElementById("photo");
    const empty = document.getElementById("empty");
    const caption = document.getElementById("caption");
    let timer = null;
    let shownId = null;

    function goHome() {
      try { document.exitFullscreen(); } catch (e) {}
      location.href = home;
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        e.preventDefault();
        goHome();
      }
    });

    document.addEventListener("click", (e) => {
      if (e.target.closest(".admin-btn")) return;
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    }, { once: true });

    async function tick() {
      const res = await fetch(api, { cache: "no-store" });
      const data = await res.json();
      if (!data.photo_id) {
        img.hidden = true;
        empty.hidden = false;
        caption.textContent = "";
        shownId = null;
        timer = setTimeout(tick, 3000);
        return;
      }
      empty.hidden = true;
      if (shownId !== data.photo_id) {
        img.src = data.url;
        img.hidden = false;
        caption.textContent = photoCredit(data.nickname, data.caption);
        shownId = data.photo_id;
      } else {
        caption.textContent = photoCredit(data.nickname, data.caption);
      }
      const waitMs = Math.max(250, (data.show_until - data.server_now) * 1000);
      timer = setTimeout(tick, waitMs);
    }

    tick();
  </script>
</body>
</html>
