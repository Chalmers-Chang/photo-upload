<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>抽獎 · {{ project.name }}</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a09; color: #f4efe6; font-family: "PingFang TC", "Noto Sans TC", sans-serif; }
    .admin-btn {
      position: fixed; top: 16px; right: 20px; z-index: 30;
      text-decoration: none; border: 1px solid #ddd4c6; background: #fffcf7;
      color: #1c1915; padding: 8px 14px; border-radius: 999px; font-size: 14px;
    }
    .stage { height: 100dvh; position: relative; }
    .msg {
      position: absolute; inset: 0; display: grid; place-items: center;
      margin: 0; opacity: 0.7; font-size: 22px;
    }
    .scene {
      height: 100%;
      perspective: 1100px;
      display: grid;
      place-items: center;
    }
    .sphere {
      position: relative;
      width: 1px;
      height: 1px;
      transform-style: preserve-3d;
    }
    .sphere.spin {
      animation: spin {{ seconds }}s linear forwards;
    }
    @keyframes spin {
      from { transform: rotateX(-16deg) rotateY(0deg); }
      to { transform: rotateX(22deg) rotateY(1080deg); }
    }
    .sphere img {
      position: absolute;
      left: 0;
      top: 0;
      width: 76px;
      height: 76px;
      object-fit: cover;
      border-radius: 10px;
      backface-visibility: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .result {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      overflow: hidden;
    }
    .winner-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      z-index: 2;
    }
    .winner-wrap img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      object-position: center;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.55);
    }
    .label {
      position: relative;
      z-index: 3;
      padding: 16px 24px 28px;
      text-align: center;
      font-size: clamp(18px, 3vw, 28px);
    }
    .floater {
      position: absolute;
      width: 92px;
      height: 92px;
      object-fit: cover;
      border-radius: 14px;
      z-index: 1;
      opacity: 0.88;
      box-shadow: 0 10px 24px rgba(0,0,0,0.4);
      animation: drift 5.5s ease-in-out infinite;
    }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) rotate(-7deg); }
      50% { transform: translate(14px, -16px) rotate(8deg); }
    }
    [hidden] { display: none !important; }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='profile.css') }}">
</head>
<body>
  <a class="admin-btn" href="{{ url_for('admin_home') }}">Admin</a>
  {% include "_name_modal.html" %}
  <div class="stage">
    <p class="msg" id="status">準備抽獎…</p>
    <div class="scene" id="scene" hidden>
      <div class="sphere" id="sphere"></div>
    </div>
    <div class="result" id="result" hidden>
      <div class="winner-wrap"><img id="winner" alt=""></div>
      <div class="label" id="label"></div>
    </div>
  </div>
  <script>
    const drawUrl = {{ url_for('lottery_draw', slug=project.slug) | tojson }};
    const home = {{ url_for('project_home', slug=project.slug) | tojson }};
    const seconds = {{ seconds | tojson }};
    const status = document.getElementById("status");
    const scene = document.getElementById("scene");
    const sphere = document.getElementById("sphere");
    const result = document.getElementById("result");
    const winner = document.getElementById("winner");
    const label = document.getElementById("label");

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") location.href = home;
    });

    function spherePoints(n) {
      const pts = [];
      const golden = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < n; i++) {
        const y = n === 1 ? 0 : 1 - (i / (n - 1)) * 2;
        const r = Math.sqrt(Math.max(0, 1 - y * y));
        const theta = golden * i;
        pts.push({ x: Math.cos(theta) * r, y, z: Math.sin(theta) * r });
      }
      return pts;
    }

    function layoutSphere(photos) {
      const n = Math.max(photos.length, 1);
      const radius = Math.min(window.innerWidth, window.innerHeight) * 0.34;
      const pts = spherePoints(n);
      sphere.innerHTML = "";
      photos.forEach((p, i) => {
        const img = document.createElement("img");
        img.src = p.url;
        img.alt = "";
        const pt = pts[i];
        const rotY = Math.atan2(pt.x, pt.z) * 180 / Math.PI;
        const rotX = -Math.asin(pt.y) * 180 / Math.PI;
        img.style.transform =
          `translate(-50%, -50%) translate3d(${pt.x * radius}px, ${pt.y * radius}px, ${pt.z * radius}px) rotateY(${rotY}deg) rotateX(${rotX}deg)`;
        sphere.appendChild(img);
      });
    }

    function placeFloaters(photos) {
      const used = [];
      photos.forEach((p, i) => {
        const img = document.createElement("img");
        img.src = p.url;
        img.alt = "";
        img.className = "floater";
        let left, top, ok = false;
        for (let t = 0; t < 12; t++) {
          const edge = Math.floor(Math.random() * 4);
          if (edge === 0) { left = 6 + Math.random() * 88; top = 6 + Math.random() * 16; }
          else if (edge === 1) { left = 6 + Math.random() * 88; top = 78 + Math.random() * 14; }
          else if (edge === 2) { left = 4 + Math.random() * 16; top = 12 + Math.random() * 70; }
          else { left = 80 + Math.random() * 16; top = 12 + Math.random() * 70; }
          ok = used.every(([x, y]) => Math.hypot(x - left, y - top) > 12);
          if (ok) break;
        }
        used.push([left, top]);
        img.style.left = left + "%";
        img.style.top = top + "%";
        img.style.animationDelay = (i * 0.35) + "s";
        result.appendChild(img);
      });
    }

    function showWinner(data) {
      scene.hidden = true;
      result.hidden = false;
      winner.src = data.winner.url;
      const who = (data.winner.nickname || "").trim() || "這位朋友";
      const n = data.winner.upload_count || 1;
      label.textContent = "恭喜 " + who + " 中獎，共上傳了 " + n + " 張照片";
      placeFloaters(data.device_photos || []);
    }

    async function run() {
      const res = await fetch(drawUrl, { method: "POST", cache: "no-store" });
      const data = await res.json();
      if (!res.ok) {
        status.textContent = data.error || "抽獎失敗";
        return;
      }
      status.hidden = true;
      const photos = data.sphere && data.sphere.length ? data.sphere : [data.winner];
      layoutSphere(photos);
      scene.hidden = false;
      sphere.classList.add("spin");
      window.setTimeout(() => showWinner(data), (data.seconds || seconds) * 1000);
    }

    run();
  </script>
</body>
</html>
