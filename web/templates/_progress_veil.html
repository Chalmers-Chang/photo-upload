<div class="progress-veil" id="progress" hidden>
  <div class="progress-glass">
    <div class="pie">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="45"></circle>
        <circle class="fill" id="pie-fill" cx="60" cy="60" r="45"
                stroke-dasharray="282.7" stroke-dashoffset="282.7"></circle>
      </svg>
      <span class="pct" id="pie-pct">0%</span>
    </div>
    <p class="progress-label" id="progress-label">{{ msg.upload_progress }}</p>
  </div>
</div>
