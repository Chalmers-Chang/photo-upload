<style>
  .progress-veil:not(.is-on) { display: none !important; }
  .progress-veil.is-on {
    display: grid !important;
    place-items: center;
    position: fixed;
    inset: 0;
    z-index: 10000;
    padding: 2cm;
    box-sizing: border-box;
  }
  .progress-glass {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    gap: 18px;
    align-content: center;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.42);
    border: 1px solid rgba(255, 255, 255, 0.55);
    box-shadow: 0 8px 32px rgba(28, 25, 21, 0.08);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
  }
  .pie {
    position: relative;
    width: min(42vw, 220px);
    aspect-ratio: 1;
  }
  .pie svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .pie .track {
    fill: none;
    stroke: rgba(28, 25, 21, 0.12);
    stroke-width: 10;
  }
  .pie .fill {
    fill: none;
    stroke: #d4af37;
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.2s linear;
  }
  .pie .pct {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: clamp(22px, 4vw, 36px);
    font-weight: 700;
    color: rgba(28, 25, 21, 0.72);
  }
  .progress-label {
    margin: 0;
    text-align: center;
    white-space: pre-line;
    color: rgba(28, 25, 21, 0.48);
    font-weight: 700;
    font-size: clamp(16px, 2.4vw, 22px);
  }
</style>
<div class="progress-veil" id="progress" hidden>
  <div class="progress-glass">
    <div class="pie">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="45"></circle>
        <circle class="fill" id="pie-fill" cx="60" cy="60" r="45"
                stroke-dasharray="282.7" stroke-dashoffset="282.7"></circle>
      </svg>
      <span class="pct" id="pie-pct">0%</span>
    </div>
    <p class="progress-label" id="progress-label">{{ msg.upload_progress }}</p>
  </div>
</div>
