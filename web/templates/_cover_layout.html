<style>
  /* Cover-photo page (project home, Ichiban Kuji). Size knobs: Mobile / Desktop blocks below. */
  html, body { height: 100%; overflow: hidden; --edge: 2cm; }
  .pjt-stage {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: #fff;
  }
  .pjt-stage picture,
  .pjt-stage picture img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .pjt-fade {
    position: absolute;
    inset: 0;
    background: #fff;
    pointer-events: none;
  }
  .pjt-ui { z-index: 2; }
  .pjt-ui > .glass-card {
    width: 100%;
    display: grid;
    place-items: center;
    padding: 24px 0.2cm;
    overflow: auto;
  }
  .pjt-ui .glass-body { width: min(720px, 100%); }
  .pjt-title-block {
    display: grid;
    justify-items: stretch;
    width: max-content;
    max-width: 100%;
  }
  .pjt-stage h1 {
    font-family: "Snell Roundhand", "Savoye LET", "Segoe Script", "Apple Chancery", "Kaiti TC", "STKaiti", "KaiTi", cursive;
    font-size: var(--pjt-title);
    font-weight: 400;
    letter-spacing: 0;
    line-height: 1.15;
    text-align: center;
    margin: 0 0 16px;
    width: auto;
    opacity: {{ 1 - cfg.title_fade }};
  }
  .pjt-mark {
    display: block;
    width: auto;
    height: auto;
    max-width: var(--pjt-mark);
    max-height: var(--pjt-mark);
    object-fit: contain;
    justify-self: center;
    margin: 0 auto 16px;
    background: transparent;
  }
  .pjt-stage .lead {
    white-space: pre-line;
    text-align: center;
    font-size: var(--pjt-lead);
  }
  .pjt-stage .actions {
    display: grid;
    gap: var(--pjt-btn-gap);
    width: min(720px, 100%);
    margin-top: 0.4cm;
    padding: 0 var(--pjt-btn-inset);
    justify-self: center;
    box-sizing: border-box;
  }
  .pjt-stage .btn {
    box-sizing: border-box;
    width: 100%;
    height: auto;
    display: grid;
    place-items: center;
    white-space: pre-line;
    padding: var(--pjt-btn-pad);
    font: inherit;
    font-size: var(--pjt-btn-size);
    font-weight: 700;
    line-height: 1.35;
    border-radius: var(--pjt-btn-radius);
    color: var(--ink-fade);
    border: 1px solid #fff;
    cursor: pointer;
  }
  .pjt-stage .btn:not(.secondary):not(.lottery) { background: var(--btn-upload); }
  .pjt-stage .btn.secondary { background: var(--btn-slideshow); }
  .pjt-stage .btn.lottery { background: var(--btn-lottery); }

  /* Mobile ≤640px */
  @media (max-width: 640px) {
    html, body {
      --pjt-title: clamp(40px, 11vw, 56px);
      --pjt-mark: 3.9cm;
      --pjt-lead: 16px;
      --pjt-btn-size: 16px;
      --pjt-btn-pad: 16px 14px;
      --pjt-btn-radius: 14px;
      --pjt-btn-gap: 0.3cm;
      --pjt-btn-inset: 0.6cm;
    }
  }

  /* Desktop ≥641px */
  @media (min-width: 641px) {
    html, body {
      --pjt-title: clamp(52px, 9vw, 84px);
      --pjt-mark: 11.7cm;
      --pjt-lead: 22px;
      --pjt-btn-size: 18px;
      --pjt-btn-pad: 22px 20px;
      --pjt-btn-radius: 16px;
      --pjt-btn-gap: 0.3cm;
      --pjt-btn-inset: 0.6cm;
    }
  }
</style>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const stage = document.querySelector(".pjt-stage");
    if (!stage) return;
    const visible = [...stage.querySelectorAll("picture img")];
    const go = () => stage.classList.add("is-ready");
    if (!visible.length) {
      requestAnimationFrame(go);
      return;
    }
    Promise.all(
      visible.map((img) =>
        img.decode ? img.decode().catch(() => {}) : Promise.resolve()
      )
    ).then(() => requestAnimationFrame(go));
  });
</script>
