{% extends "base.html" %}
{% block title %}上傳 · {{ project.name }}{% endblock %}
{% block body %}
<div class="wrap">
  <p class="meta"><a href="{{ url_for('project_home', slug=project.slug) }}">← {{ project.name }}</a></p>
  <h1>上傳照片</h1>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <p class="flash {{ category }}">{{ message }}</p>
  {% endfor %}
  <form class="stack" method="post" enctype="multipart/form-data">
    <label>照片</label>
    <input type="file" name="photo" accept="image/*" required>
    <label>一段話（可留空）</label>
    <textarea name="caption" maxlength="500" placeholder="這張想說的話"></textarea>
    <button class="btn" type="submit">上傳</button>
  </form>
</div>
{% endblock %}
