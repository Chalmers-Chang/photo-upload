name: Deploy

on:
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/chalmers-chang/photo-upload

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-compose/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: read
      packages: read
    env:
      DOCKER_CONFIG: ${{ runner.temp }}/docker-config
    steps:
      - uses: actions/checkout@v4

      - name: Copy project to /opt/app/photo-upload
        run: |
          dest=/opt/app/photo-upload
          echo "runner user=$(whoami)"
          ls -ld /opt/app
          if [ ! -w /opt/app ]; then
            echo "/opt/app is not writable by $(whoami)"
            echo "On the Mac Mini run: sudo chown -R $(whoami) /opt/app"
            exit 1
          fi
          mkdir -p "$dest"
          rsync -rlt --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.cursor/' \
            "${GITHUB_WORKSPACE}/" "$dest/"

      - name: Login to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${DOCKER_CONFIG}"
          echo "registry=ghcr.io"
          echo "user=${GHCR_USER}"
          echo "token set=$([ -n "${GHCR_TOKEN}" ] && echo yes || echo no)"
          echo "docker config=${DOCKER_CONFIG}"
          echo "checking ghcr.io ..."
          curl -sS -o /dev/null -w "ghcr.io http=%{http_code} time=%{time_total}s\n" --max-time 15 https://ghcr.io/v2/ || true
          echo "docker login starting ..."
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          echo "docker login finished"

      - name: Start stack
        working-directory: /opt/app/photo-upload/docker-compose
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose pull && docker compose up -d
