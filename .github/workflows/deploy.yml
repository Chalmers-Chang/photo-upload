name: Deploy

on:
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Copy project to /opt/app
        run: |
          echo "runner user=$(whoami)"
          ls -ld /opt/app
          if [ ! -w /opt/app ]; then
            echo "/opt/app is not writable by $(whoami)"
            echo "On the Mac Mini run: sudo chown -R $(whoami) /opt/app"
            exit 1
          fi
          rsync -rlt --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.cursor/' \
            "${GITHUB_WORKSPACE}/" /opt/app/

      - name: Start stack
        working-directory: /opt/app/docker-compose
        run: docker compose up -d --build
