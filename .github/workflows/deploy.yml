name: Deploy

on:
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-compose/Dockerfile
          platforms: linux/arm64
          push: false
          tags: photo-upload:${{ github.sha }}
          outputs: type=docker,dest=photo-upload.tar

      - uses: actions/upload-artifact@v4
        with:
          name: photo-upload-image
          path: photo-upload.tar
          retention-days: 1

  deploy:
    needs: build
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Copy project to /opt/app/photo-upload
        run: |
          dest=/opt/app/photo-upload
          echo "runner user=$(whoami)"
          ls -ld /opt/app
          if [ ! -w /opt/app ]; then
            echo "/opt/app is not writable by $(whoami)"
            echo "On the Mac Mini run: sudo chown -R $(whoami) /opt/app"
            exit 1
          fi
          mkdir -p "$dest"
          rsync -rlt --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.cursor/' \
            "${GITHUB_WORKSPACE}/" "$dest/"

      - uses: actions/download-artifact@v4
        with:
          name: photo-upload-image
          path: /tmp/photo-upload-image

      - name: Load image
        run: docker load -i /tmp/photo-upload-image/photo-upload.tar

      - name: Start stack
        working-directory: /opt/app/photo-upload/docker-compose
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose up -d --pull never
